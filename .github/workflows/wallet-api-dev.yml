name: wallet-api DEV

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  IMAGE: dfxswiss/wallet-api
  TAG: beta

permissions:
  contents: read

concurrency:
  group: wallet-api-image-beta
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push Docker image (DEV)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check publish branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "${REF}" != "refs/heads/develop" ]; then
            echo "::error::The beta tag publishes only from refs/heads/develop"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Notify infrastructure
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          DISPATCH_REPO: ${{ secrets.DISPATCH_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ] || [ -z "${DISPATCH_REPO}" ]; then
            echo "::warning::DISPATCH_TOKEN or DISPATCH_REPO is empty; skipping image-published notification"
            exit 0
          fi
          gh api "repos/${DISPATCH_REPO}/dispatches" \
            -f event_type=image-published \
            -f "client_payload[image]=${IMAGE}" \
            -f "client_payload[tag]=${TAG}" \
            -f "client_payload[sha]=${GITHUB_SHA}"
