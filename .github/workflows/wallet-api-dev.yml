name: wallet-api DEV

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  IMAGE: dfxswiss/wallet-api
  TAG: beta

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push Docker image (DEV)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check publish branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "${REF}" != "refs/heads/develop" ]; then
            echo "::error::The beta tag publishes only from refs/heads/develop"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}

  promote:
    name: Promote channel tag (DEV)
    needs: build-and-push
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: wallet-api-image-beta
      cancel-in-progress: false
    steps:
      - name: Resolve branch head
        id: head
        env:
          BRANCH: develop
        run: |
          set -euo pipefail
          HEAD_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [ -z "${HEAD_SHA}" ]; then
            echo "::error::Could not resolve refs/heads/${BRANCH}"
            exit 1
          fi
          echo "sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check head image
        id: image
        env:
          IMAGE: ${{ env.IMAGE }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "${HEAD_SHA}" = "${GITHUB_SHA}" ]; then
            echo "promote=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          for attempt in 1 2 3; do
            if output="$(docker buildx imagetools inspect "${IMAGE}:${HEAD_SHA}" 2>&1)"; then
              echo "promote=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            if printf '%s\n' "${output}" | grep -qiE 'not found|manifest unknown'; then
              echo "promote=false" >> "${GITHUB_OUTPUT}"
              echo "::notice::The image of head ${HEAD_SHA} is not pushed yet; its own run will promote it"
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              sleep 10
            fi
          done

          echo "::error::Could not inspect image ${IMAGE}:${HEAD_SHA}: ${output}"
          exit 1

      - name: Promote channel tag
        if: steps.image.outputs.promote == 'true'
        env:
          IMAGE: ${{ env.IMAGE }}
          TAG: ${{ env.TAG }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:${TAG}" "${IMAGE}:${HEAD_SHA}"

      - name: Notify infrastructure
        if: steps.image.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          DISPATCH_REPO: ${{ secrets.DISPATCH_REPO }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ] || [ -z "${DISPATCH_REPO}" ]; then
            echo "::warning::DISPATCH_TOKEN or DISPATCH_REPO is empty; skipping image-published notification"
            exit 0
          fi
          gh api "repos/${DISPATCH_REPO}/dispatches" \
            -f event_type=image-published \
            -f "client_payload[image]=${IMAGE}" \
            -f "client_payload[tag]=${TAG}" \
            -f "client_payload[sha]=${HEAD_SHA}"
