name: wallet-api PRD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: dfxswiss/wallet-api
  TAG: latest

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push Docker image (PRD)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check publish branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "${REF}" != "refs/heads/main" ]; then
            echo "::error::The latest tag publishes only from refs/heads/main"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}

  promote:
    name: Promote channel tag (PRD)
    needs: build-and-push
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: wallet-api-image-latest
      cancel-in-progress: false
    steps:
      - name: Check branch tip
        id: tip
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH: main
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [ -z "${REMOTE_SHA}" ]; then
            echo "::error::Could not resolve refs/heads/${BRANCH}"
            exit 1
          fi
          if [ "${REMOTE_SHA}" = "${GITHUB_SHA}" ]; then
            echo "promote=true" >> "${GITHUB_OUTPUT}"
          else
            echo "promote=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Run ${GITHUB_SHA} is superseded by ${REMOTE_SHA}; the ${TAG} tag stays unchanged"
          fi

      - name: Log in to Docker Hub
        if: steps.tip.outputs.promote == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        if: steps.tip.outputs.promote == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Promote channel tag
        if: steps.tip.outputs.promote == 'true'
        env:
          IMAGE: ${{ env.IMAGE }}
          TAG: ${{ env.TAG }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:${TAG}" "${IMAGE}:${GITHUB_SHA}"

      - name: Notify infrastructure
        if: steps.tip.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          DISPATCH_REPO: ${{ secrets.DISPATCH_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ] || [ -z "${DISPATCH_REPO}" ]; then
            echo "::warning::DISPATCH_TOKEN or DISPATCH_REPO is empty; skipping image-published notification"
            exit 0
          fi
          gh api "repos/${DISPATCH_REPO}/dispatches" \
            -f event_type=image-published \
            -f "client_payload[image]=${IMAGE}" \
            -f "client_payload[tag]=${TAG}" \
            -f "client_payload[sha]=${GITHUB_SHA}"
